[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-malware-agent"
version = "0.0.0"
description = "Guardrail chống Indirect Prompt Injection cho agent phân tích mã độc (prototype Phase 2)."
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
